---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: cappconfigs.rcs.dana.io
spec:
  group: rcs.dana.io
  names:
    kind: CappConfig
    listKind: CappConfigList
    plural: cappconfigs
    singular: cappconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CappConfig is the Schema for the cappconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CappConfigSpec defines the desired state of CappConfig
            properties:
              allowedHostnamePatterns:
                default: []
                description: |-
                  AllowedHostnamePatterns is a list of hostname patterns used to validate Capp hostnames.
                  If the Capp hostname matches a pattern, it is allowed to be created.
                  Defaults to an empty list (all hostnames denied) if not specified.
                items:
                  description: HostnamePattern defines a regex pattern for validating
                    Capp hostnames.
                  properties:
                    explanation:
                      description: Explanation is a human-readable description shown
                        in webhook error messages.
                      maxLength: 100
                      type: string
                    match:
                      description: |-
                        Match is a regex used to match Capp hostnames.
                        The regex is anchored, so it must match the whole hostname (e.g. ".*\.example\.com"
                        does not match "app.example.com.other.net").
                      minLength: 1
                      type: string
                  required:
                  - match
                  type: object
                type: array
              autoscaleConfig:
                properties:
                  activationScale:
                    description: ActivationScale is the default number of replicas
                      used when a scale-to-zero Capp scales up from idle.
                    minimum: 2
                    type: integer
                  concurrency:
                    description: Concurrency is the maximum concurrency of a Capp.
                    minimum: 1
                    type: integer
                  cpu:
                    description: CPU is the desired CPU utilization to trigger upscaling.
                    minimum: 1
                    type: integer
                  maxReplicasLimit:
                    description: MaxReplicasLimit is the global maximum scale (maximum
                      allowed value for maxReplicas).
                    minimum: 1
                    type: integer
                  maxScaleDelay:
                    default: 3600
                    description: MaxScaleDelay is the maximum delay in seconds before
                      the Autoscaler scales down the Capp to zero.
                    minimum: 0
                    type: integer
                  memory:
                    description: Memory is the desired memory utilization to trigger
                      upscaling.
                    minimum: 1
                    type: integer
                  minReplicasLimit:
                    description: MinReplicasLimit is the global minimum scale. (maximum
                      allowed value for minReplicas).
                    minimum: 1
                    type: integer
                  rps:
                    description: RPS is the desired requests per second to trigger
                      upscaling.
                    minimum: 1
                    type: integer
                required:
                - activationScale
                - concurrency
                - cpu
                - maxReplicasLimit
                - maxScaleDelay
                - memory
                - minReplicasLimit
                - rps
                type: object
              defaultResources:
                description: |-
                  DefaultResources is the default resources to be assigned to Capp.
                  If other resources are specified then they override the default values.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              dnsConfig:
                properties:
                  cname:
                    description: CNAME defines the CNAME record that will be used
                      for Capp Hostnames.
                    minLength: 1
                    type: string
                  issuerRef:
                    description: IssuerRef identifies the cert-manager issuer used
                      to issue certificates.
                    properties:
                      group:
                        description: Group is the API group of the certificate issuer
                          (e.g. cert-manager.io).
                        minLength: 1
                        type: string
                      kind:
                        description: Kind is the kind of the certificate issuer (e.g.
                          ClusterIssuer).
                        minLength: 1
                        type: string
                      name:
                        description: Name is the name of the certificate issuer.
                        minLength: 1
                        type: string
                    required:
                    - group
                    - kind
                    - name
                    type: object
                  provider:
                    description: Provider defines the DNS provider.
                    minLength: 1
                    type: string
                  zone:
                    description: Zone defines the DNS zone for Capp Hostnames.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: zone must end with '.'
                      rule: self.endsWith('.')
                required:
                - cname
                - issuerRef
                - provider
                - zone
                type: object
              gatewayAPI:
                description: |-
                  GatewayAPI makes the operator route Capp hostnames through Gateway API objects that it creates itself,
                  instead of through Knative DomainMappings. Set it when Knative uses the net-gateway-api ingress, where a
                  DomainMapping's backend is an ExternalName Service that implementations such as Envoy Gateway refuse.
                  When unset, hostnames are served through DomainMappings. See docs/gateway-api-routing.md.
                properties:
                  gateway:
                    description: |-
                      Gateway is the Gateway that hostname routes and ListenerSets attach to. It is normally the Gateway
                      of the external-gateways entry in Knative's config-gateway ConfigMap.
                    properties:
                      name:
                        description: Name is the name of the object.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace of the object.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  httpsPort:
                    default: 443
                    description: |-
                      HTTPSPort is the port of the HTTPS listener in each ListenerSet. It must be a port that the
                      Gateway's load balancer exposes.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  localGatewayService:
                    description: |-
                      LocalGatewayService is the Service in front of Knative's cluster-local gateway: the service of the
                      local-gateways entry in Knative's config-gateway ConfigMap. Hostname traffic is sent to it with the
                      Host header rewritten to the Knative Service's cluster-local name, which is the path a DomainMapping takes.
                    properties:
                      name:
                        description: Name is the name of the Service.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace of the Service.
                        minLength: 1
                        type: string
                      port:
                        default: 80
                        description: Port is the Service port that serves HTTP.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - name
                    - namespace
                    type: object
                  tlsMode:
                    default: ListenerSet
                    description: TLSMode selects how HTTPS is served for Capps with
                      tlsEnabled.
                    enum:
                    - ListenerSet
                    - Gateway
                    type: string
                required:
                - gateway
                - localGatewayService
                type: object
              revisionHistoryLimit:
                default: 10
                description: RevisionHistoryLimit defines how many CappRevisions will
                  be retained
                minimum: 1
                type: integer
            required:
            - allowedHostnamePatterns
            - autoscaleConfig
            - defaultResources
            - dnsConfig
            type: object
          status:
            description: CappConfigStatus defines the observed state of CappConfig
            type: object
        type: object
    served: true
    storage: true
